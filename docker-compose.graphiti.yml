services:
  neo4j:
    image: neo4j:5.23
    container_name: mirofish-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-please_change_me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  graphiti:
    image: zepai/graphiti:latest
    container_name: mirofish-graphiti
    restart: unless-stopped
    depends_on:
      - neo4j
    environment:
      GRAPHITI_DB_PROVIDER: neo4j
      GRAPHITI_DB_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      GRAPHITI_DB_USERNAME: ${NEO4J_USERNAME:-neo4j}
      GRAPHITI_DB_PASSWORD: ${NEO4J_PASSWORD:-please_change_me}
    ports:
      - "8000:8000"

volumes:
  neo4j_data:
