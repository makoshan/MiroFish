[project]
name = "local-graphiti-compat"
version = "0.1.0"
description = "Local Graphiti-compatible API shim for MiroFish"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.49.0",
    "fastapi>=0.115.0",
    "graphiti-core>=0.28.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.4.0",
    "uvicorn>=0.30.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphiti_compat"]
